<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BTC Strategy Lab</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090b10;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .sub {
      color: #8f99a8;
      margin-bottom: 25px;
    }

    .card {
      background: #11151d;
      border: 1px solid #242a35;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .signal {
      font-size: 42px;
      font-weight: bold;
      margin: 12px 0;
    }

    .BUY {
      color: #24d17e;
    }

    .SELL {
      color: #ff5665;
    }

    .WAIT {
      color: #f1c84b;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(150px, 1fr)
        );
      gap: 12px;
    }

    .stat {
      background: #171c25;
      padding: 13px;
      border-radius: 12px;
    }

    .label {
      color: #8993a2;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .value {
      font-size: 18px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #ffffff;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    ul {
      padding-left: 20px;
    }

    .error {
      color: #ff6573;
      white-space: pre-wrap;
    }

    .good {
      color: #24d17e;
    }

    .bad {
      color: #ff5665;
    }

    .neutral {
      color: #f1c84b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      border-bottom:
        1px solid #292f39;
      padding: 8px 4px;
      text-align: left;
    }

    th {
      color: #8993a2;
    }

    .scroll {
      overflow-x: auto;
    }

  </style>

</head>

<body>

<div class="wrap">

  <h1>BTC Strategy Lab</h1>

  <div class="sub">
    H1 Trend + M15 Pullback
  </div>


  <!-- ===============================================
       LIVE SIGNAL
  ================================================ -->

  <div class="card">

    <h2>Live Analysis</h2>

    <div
      id="signal"
      class="signal WAIT"
    >
      ...
    </div>

    <div class="grid">

      <div class="stat">
        <div class="label">
          PRICE
        </div>
        <div
          id="price"
          class="value"
        >
          -
        </div>
      </div>

      <div class="stat">
        <div class="label">
          H1 TREND
        </div>
        <div
          id="trend"
          class="value"
        >
          -
        </div>
      </div>

      <div class="stat">
        <div class="label">
          RSI
        </div>
        <div
          id="rsi"
          class="value"
        >
          -
        </div>
      </div>

      <div class="stat">
        <div class="label">
          ATR
        </div>
        <div
          id="atr"
          class="value"
        >
          -
        </div>
      </div>

    </div>


    <div
      id="tradeLevels"
      style="margin-top:15px;"
    ></div>


    <ul id="reasons"></ul>


    <button onclick="loadSignal()">
      Refresh BTC Analysis
    </button>


    <div
      id="liveError"
      class="error"
    ></div>

  </div>


  <!-- ===============================================
       BACKTEST
  ================================================ -->

  <div class="card">

    <h2>BTC Backtest</h2>

    <button
      id="backtestBtn"
      onclick="runBacktest()"
    >
      Run Backtest
    </button>

    <div
      id="backtestLoading"
      style="
        margin-top:15px;
        color:#8993a2;
      "
    ></div>


    <div
      id="backtestStats"
      class="grid"
      style="margin-top:15px;"
    ></div>


    <div
      id="backtestError"
      class="error"
    ></div>

  </div>


  <!-- ===============================================
       TRADES
  ================================================ -->

  <div
    class="card"
    id="tradesCard"
    style="display:none;"
  >

    <h2>
      Recent Backtest Trades
    </h2>

    <div class="scroll">

      <table>

        <thead>

        <tr>
          <th>Side</th>
          <th>Entry</th>
          <th>Exit</th>
          <th>Result</th>
          <th>Reason</th>
        </tr>

        </thead>

        <tbody
          id="tradeRows"
        ></tbody>

      </table>

    </div>

  </div>

</div>


<script>

// =========================================================
// FORMAT
// =========================================================

function money(v) {

  if (
    v === null ||
    v === undefined
  ) {
    return "-";
  }

  return Number(v)
    .toLocaleString(
      "en-US",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );
}


// =========================================================
// LIVE SIGNAL
// =========================================================

async function loadSignal() {

  const signalEl =
    document.getElementById(
      "signal"
    );

  const errorEl =
    document.getElementById(
      "liveError"
    );

  errorEl.textContent = "";

  signalEl.textContent =
    "LOADING...";

  signalEl.className =
    "signal WAIT";


  try {

    const response =
      await fetch(
        "/api/btc?t=" +
        Date.now(),
        {
          cache:
            "no-store"
        }
      );


    const data =
      await response.json();


    if (!data.ok) {
      throw new Error(
        data.error ||
        "Analysis failed"
      );
    }


    signalEl.textContent =
      data.signal;

    signalEl.className =
      "signal " +
      data.signal;


    document.getElementById(
      "price"
    ).textContent =
      "$" +
      money(
        data.price
      );


    document.getElementById(
      "trend"
    ).textContent =
      data.trend.h1;


    document.getElementById(
      "rsi"
    ).textContent =
      data.m15.rsi;


    document.getElementById(
      "atr"
    ).textContent =
      "$" +
      money(
        data.m15.atr
      );


    const levels =
      document.getElementById(
        "tradeLevels"
      );


    if (
      data.signal ===
      "WAIT"
    ) {

      levels.innerHTML =
        `
        <div style="color:#8993a2">
          No confirmed BTC entry.
        </div>
        `;
    }

    else {

      levels.innerHTML =
        `
        <div class="grid">

          <div class="stat">
            <div class="label">
              ENTRY
            </div>
            <div class="value">
              $${money(data.entry)}
            </div>
          </div>

          <div class="stat">
            <div class="label">
              STOP LOSS
            </div>
            <div class="value">
              $${money(data.stopLoss)}
            </div>
          </div>

          <div class="stat">
            <div class="label">
              TP1 1.5R
            </div>
            <div class="value">
              $${money(data.takeProfit1)}
            </div>
          </div>

          <div class="stat">
            <div class="label">
              TP2 2.2R
            </div>
            <div class="value">
              $${money(data.takeProfit2)}
            </div>
          </div>

        </div>
        `;
    }


    const list =
      document.getElementById(
        "reasons"
      );


    list.innerHTML = "";


    for (
      const reason of
      data.reasons
    ) {

      const li =
        document.createElement(
          "li"
        );

      li.textContent =
        reason;

      list.appendChild(li);
    }

  }

  catch (error) {

    signalEl.textContent =
      "ERROR";

    signalEl.className =
      "signal SELL";

    errorEl.textContent =
      error.message;
  }
}


// =========================================================
// BACKTEST
// =========================================================

async function runBacktest() {

  const button =
    document.getElementById(
      "backtestBtn"
    );

  const loading =
    document.getElementById(
      "backtestLoading"
    );

  const error =
    document.getElementById(
      "backtestError"
    );

  const stats =
    document.getElementById(
      "backtestStats"
    );


  button.disabled =
    true;

  loading.textContent =
    "Running BTC historical test...";

  error.textContent =
    "";

  stats.innerHTML =
    "";


  try {

    const response =
      await fetch(
        "/api/backtest?t=" +
        Date.now(),
        {
          cache:
            "no-store"
        }
      );


    const data =
      await response.json();


    if (!data.ok) {
      throw new Error(
        data.error ||
        "Backtest failed"
      );
    }


    loading.textContent =
      `${data.period.from} → ${data.period.to}`;


    const r =
      data.results;


    const pfClass =
      r.profitFactor >= 1.2
        ? "good"
        : r.profitFactor >= 1
        ? "neutral"
        : "bad";


    const netClass =
      r.netR > 0
        ? "good"
        : r.netR < 0
        ? "bad"
        : "neutral";


    stats.innerHTML =
      `

      <div class="stat">
        <div class="label">
          TRADES
        </div>
        <div class="value">
          ${r.trades}
        </div>
      </div>


      <div class="stat">
        <div class="label">
          WIN RATE
        </div>
        <div class="value">
          ${r.winRate}%
        </div>
      </div>


      <div class="stat">
        <div class="label">
          PROFIT FACTOR
        </div>
        <div class="value ${pfClass}">
          ${r.profitFactor}
        </div>
      </div>


      <div class="stat">
        <div class="label">
          NET R
        </div>
        <div class="value ${netClass}">
          ${r.netR}R
        </div>
      </div>


      <div class="stat">
        <div class="label">
          AVG R / TRADE
        </div>
        <div class="value">
          ${r.averageR}R
        </div>
      </div>


      <div class="stat">
        <div class="label">
          MAX DRAWDOWN
        </div>
        <div class="value">
          ${r.maxDrawdownR}R
        </div>
      </div>


      <div class="stat">
        <div class="label">
          WINS
        </div>
        <div class="value good">
          ${r.wins}
        </div>
      </div>


      <div class="stat">
        <div class="label">
          LOSSES
        </div>
        <div class="value bad">
          ${r.losses}
        </div>
      </div>


      <div class="stat">
        <div class="label">
          BREAKEVEN
        </div>
        <div class="value">
          ${r.breakevens}
        </div>
      </div>


      <div class="stat">
        <div class="label">
          MAX LOSS STREAK
        </div>
        <div class="value">
          ${r.maxLossStreak}
        </div>
      </div>


      <div class="stat">
        <div class="label">
          BUY NET
        </div>
        <div class="value">
          ${r.buyNetR}R
        </div>
      </div>


      <div class="stat">
        <div class="label">
          SELL NET
        </div>
        <div class="value">
          ${r.sellNetR}R
        </div>
      </div>
      `;


    const tradeRows =
      document.getElementById(
        "tradeRows"
      );


    tradeRows.innerHTML =
      "";


    for (
      const trade of
      data.lastTrades
    ) {

      const tr =
        document.createElement(
          "tr"
        );


      const resultClass =
        trade.resultR > 0
          ? "good"
          : trade.resultR < 0
          ? "bad"
          : "neutral";


      tr.innerHTML =
        `

        <td>
          ${trade.side}
        </td>

        <td>
          $${money(trade.entry)}
        </td>

        <td>
          $${money(trade.exit)}
        </td>

        <td class="${resultClass}">
          ${trade.resultR}R
        </td>

        <td>
          ${trade.exitReason}
        </td>
        `;


      tradeRows.appendChild(
        tr
      );
    }


    document.getElementById(
      "tradesCard"
    ).style.display =
      "block";

  }

  catch (err) {

    loading.textContent =
      "";

    error.textContent =
      err.message;
  }

  finally {

    button.disabled =
      false;
  }
}


// Load current BTC analysis when page opens.

loadSignal();


// Refresh live analysis every 60 seconds.

setInterval(
  loadSignal,
  60000
);

</script>

</body>
</html>
