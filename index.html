<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
>

<meta
  name="theme-color"
  content="#05070b"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<title>MKAYFX BTC Dynamic</title>


<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{

  --bg:#05070b;
  --card:#0c111b;
  --card2:#111722;

  --border:rgba(255,255,255,.085);

  --text:#f4f6fa;
  --muted:#7f899d;

  --green:#39e6a7;
  --red:#ff5f78;
  --blue:#7295ff;
  --gold:#f2c866;

}

body{

  margin:0;

  min-height:100vh;

  background:
    radial-gradient(
      circle at top,
      #101726 0,
      #05070b 42%
    );

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}

.app{

  width:min(
    100%,
    760px
  );

  margin:auto;

  padding:
    24px 18px 80px;

}

.hero{

  padding:
    28px 24px;

  border:
    1px solid var(--border);

  border-radius:
    30px;

  background:
    linear-gradient(
      145deg,
      #111827,
      #090d15
    );

  margin-bottom:
    22px;

}

.brand{

  color:
    var(--green);

  font-size:
    13px;

  font-weight:
    900;

  letter-spacing:
    3px;

}

h1{

  margin:
    12px 0 4px;

  font-size:
    30px;

}

.subtitle{

  color:
    var(--muted);

  line-height:
    1.6;

}

.card{

  background:
    rgba(
      12,
      17,
      27,
      .94
    );

  border:
    1px solid var(--border);

  border-radius:
    28px;

  padding:
    24px;

  margin-top:
    20px;

}

.title{

  color:
    #919bb0;

  font-size:
    13px;

  font-weight:
    900;

  letter-spacing:
    3px;

  margin-bottom:
    20px;

}

.grid{

  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(
        0,
        1fr
      )
    );

  gap:
    14px;

}

.stat{

  min-height:
    105px;

  border:
    1px solid var(--border);

  border-radius:
    22px;

  padding:
    18px;

  background:
    var(--card2);

}

.label{

  color:
    var(--muted);

  font-size:
    12px;

  font-weight:
    800;

  letter-spacing:
    1.5px;

}

.value{

  margin-top:
    12px;

  font-size:
    24px;

  font-weight:
    900;

}

.signal{

  font-size:
    38px;

  font-weight:
    1000;

}

.buy{
  color:var(--green);
}

.sell{
  color:var(--red);
}

.wait{
  color:var(--gold);
}

.row{

  display:flex;

  gap:12px;

}

.field{

  flex:1;

}

.field label{

  display:block;

  margin:
    0 0 8px;

  color:
    var(--muted);

  font-size:
    12px;

  font-weight:
    800;

  letter-spacing:
    1.2px;

}

input,
select{

  width:100%;

  padding:
    17px;

  border-radius:
    18px;

  border:
    1px solid var(--border);

  background:
    #111722;

  color:
    white;

  font-size:
    16px;

  outline:none;

}

button{

  width:100%;

  margin-top:
    18px;

  padding:
    19px;

  border:0;

  border-radius:
    20px;

  background:
    #1b2230;

  color:white;

  font-weight:
    900;

  font-size:
    15px;

  letter-spacing:
    .6px;

}

button:active{

  transform:
    scale(.99);

}

.small{

  color:
    var(--muted);

  font-size:
    13px;

  line-height:
    1.6;

}

.bias{

  display:grid;

  grid-template-columns:
    repeat(
      4,
      1fr
    );

  gap:
    8px;

  margin-top:
    18px;

}

.biasBox{

  padding:
    12px 5px;

  text-align:center;

  border:
    1px solid var(--border);

  border-radius:
    15px;

  background:
    #0b1018;

}

.biasTF{

  color:
    var(--muted);

  font-size:
    10px;

  font-weight:
    900;

}

.biasValue{

  margin-top:
    6px;

  font-size:
    11px;

  font-weight:
    900;

}

.trade{

  padding:
    18px 0;

  border-bottom:
    1px solid var(--border);

}

.trade:last-child{

  border-bottom:0;

}

.tradeTop{

  display:flex;

  justify-content:
    space-between;

  font-weight:
    900;

}

.tradeMeta{

  margin-top:
    8px;

  color:
    var(--muted);

  font-size:
    13px;

  line-height:
    1.55;

}

.green{
  color:var(--green);
}

.red{
  color:var(--red);
}

.gold{
  color:var(--gold);
}

.loading{

  opacity:.55;

  pointer-events:none;

}

@media(
  max-width:480px
){

  .app{

    padding:
      18px 14px 70px;

  }

  .hero,
  .card{

    border-radius:
      24px;

  }

  h1{

    font-size:
      26px;

  }

}

</style>

</head>


<body>

<div class="app">


<div class="hero">

  <div class="brand">
    MKAYFX
  </div>

  <h1>
    BTC DYNAMIC
  </h1>

  <div class="subtitle">
    Coinbase BTC-USD • M1 execution • M5 structure • M15 direction
  </div>

</div>


<div class="card">

  <div class="title">
    LIVE ANALYSIS
  </div>


  <div
    id="signal"
    class="signal wait"
  >
    WAIT
  </div>


  <div
    id="setup"
    class="small"
  >
    Loading BTC analysis...
  </div>


  <div class="grid" style="margin-top:20px">

    <div class="stat">

      <div class="label">
        PRICE
      </div>

      <div
        id="price"
        class="value"
      >
        —
      </div>

    </div>


    <div class="stat">

      <div class="label">
        SCORE
      </div>

      <div
        id="score"
        class="value"
      >
        —
      </div>

    </div>


    <div class="stat">

      <div class="label">
        ENTRY
      </div>

      <div
        id="entry"
        class="value"
      >
        —
      </div>

    </div>


    <div class="stat">

      <div class="label">
        STOP
      </div>

      <div
        id="stop"
        class="value"
      >
        —
      </div>

    </div>


    <div class="stat">

      <div class="label">
        TARGET
      </div>

      <div
        id="target"
        class="value"
      >
        —
      </div>

    </div>


    <div class="stat">

      <div class="label">
        RR
      </div>

      <div
        id="rr"
        class="value"
      >
        1.5R
      </div>

    </div>

  </div>


  <div
    id="bias"
    class="bias"
  ></div>


  <button
    onclick="loadLive()"
  >
    REFRESH ANALYSIS
  </button>


  <div
    id="updated"
    class="small"
    style="
      text-align:center;
      margin-top:14px
    "
  ></div>

</div>


<div class="card">

  <div class="title">
    BTC DYNAMIC BACKTEST
  </div>


  <div class="row">

    <div class="field">

      <label>
        DAYS
      </label>

      <input
        id="days"
        type="number"
        value="10"
        min="1"
        max="30"
      >

    </div>


    <div class="field">

      <label>
        MODE
      </label>

      <select id="mode">

        <option value="SELECTIVE">
          SELECTIVE
        </option>

        <option
          value="BALANCED"
          selected
        >
          BALANCED
        </option>

        <option value="AGGRESSIVE">
          AGGRESSIVE
        </option>

      </select>

    </div>

  </div>


  <button
    id="backtestButton"
    onclick="runBacktest()"
  >
    RUN BACKTEST
  </button>


  <div
    id="backtestInfo"
    class="small"
    style="
      text-align:center;
      margin-top:14px
    "
  ></div>

</div>


<div
  id="performanceCard"
  class="card"
  style="display:none"
>

  <div class="title">
    PERFORMANCE
  </div>


  <div class="grid">

    <div class="stat">

      <div class="label">
        TRADES
      </div>

      <div
        id="trades"
        class="value"
      >
        —
      </div>

    </div>


    <div class="stat">

      <div class="label">
        WIN RATE
      </div>

      <div
        id="winRate"
        class="value"
      >
        —
      </div>

    </div>


    <div class="stat">

      <div class="label">
        PROFIT FACTOR
      </div>

      <div
        id="pf"
        class="value"
      >
        —
      </div>

    </div>


    <div class="stat">

      <div class="label">
        NET R
      </div>

      <div
        id="netR"
        class="value"
      >
        —
      </div>

    </div>


    <div class="stat">

      <div class="label">
        EXPECTANCY
      </div>

      <div
        id="expectancy"
        class="value"
      >
        —
      </div>

    </div>


    <div class="stat">

      <div class="label">
        MAX DD
      </div>

      <div
        id="drawdown"
        class="value"
      >
        —
      </div>

    </div>

  </div>


  <div
    id="tradeList"
    style="margin-top:20px"
  ></div>

</div>


</div>


<script>

function money(
  value
){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(
      Number(
        value
      )
    )
  ){
    return "—";
  }

  return (
    "$" +
    Number(
      value
    ).toLocaleString(
      undefined,
      {
        maximumFractionDigits:2
      }
    )
  );

}


function setText(
  id,
  value
){

  document
    .getElementById(
      id
    )
    .textContent =
      value;

}


function signalClass(
  signal
){

  if(
    signal === "BUY"
  ){
    return "signal buy";
  }

  if(
    signal === "SELL"
  ){
    return "signal sell";
  }

  return "signal wait";

}


function biasColor(
  value
){

  if(
    value === "BULLISH"
  ){
    return "green";
  }

  if(
    value === "BEARISH"
  ){
    return "red";
  }

  return "gold";

}


async function loadLive(){

  const signalEl =
    document.getElementById(
      "signal"
    );


  try{

    const mode =
      document.getElementById(
        "mode"
      )?.value ||
      "BALANCED";


    const response =
      await fetch(
        `/api/btc?mode=${encodeURIComponent(mode)}&t=${Date.now()}`,
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Live analysis failed"
      );

    }


    signalEl.textContent =
      data.signal;


    signalEl.className =
      signalClass(
        data.signal
      );


    setText(
      "setup",
      data.signal === "WAIT"
        ?
          `No qualifying trade • BUY ${data.buyScore ?? "—"} • SELL ${data.sellScore ?? "—"}`
        :
          `${data.setup} • ${data.mode}`
    );


    setText(
      "price",
      money(
        data.price
      )
    );


    setText(
      "score",
      data.score ?? "—"
    );


    setText(
      "entry",
      money(
        data.entry
      )
    );


    setText(
      "stop",
      money(
        data.stop
      )
    );


    setText(
      "target",
      money(
        data.target
      )
    );


    setText(
      "rr",
      `${data.rr}R`
    );


    const bias =
      data.timeframeBias ||
      {};


    document
      .getElementById(
        "bias"
      )
      .innerHTML =
        [
          "M1",
          "M5",
          "M15",
          "H1"
        ]
        .map(
          tf => {

            const value =
              bias[tf] ||
              "N/A";

            return `
              <div class="biasBox">

                <div class="biasTF">
                  ${tf}
                </div>

                <div class="biasValue ${biasColor(value)}">
                  ${value}
                </div>

              </div>
            `;

          }
        )
        .join("");


    setText(
      "updated",
      "Updated " +
      new Date()
        .toLocaleTimeString()
    );

  }catch(
    error
  ){

    signalEl.textContent =
      "ERROR";


    signalEl.className =
      "signal sell";


    setText(
      "setup",
      error.message
    );

  }

}


async function runBacktest(){

  const button =
    document.getElementById(
      "backtestButton"
    );


  const days =
    Math.max(
      1,
      Math.min(
        30,
        Number(
          document.getElementById(
            "days"
          ).value
        ) ||
        10
      )
    );


  const mode =
    document.getElementById(
      "mode"
    ).value;


  button.disabled =
    true;


  button.textContent =
    "RUNNING...";


  document
    .body
    .classList
    .add(
      "loading"
    );


  /*
    Keep the button usable while loading.
  */

  button.style.pointerEvents =
    "auto";


  setText(
    "backtestInfo",
    "Downloading Coinbase M1 candles and rebuilding M5/M15 structure..."
  );


  try{

    const started =
      Date.now();


    const response =
      await fetch(
        `/api/backtest?days=${days}&mode=${encodeURIComponent(mode)}&t=${Date.now()}`,
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Backtest failed"
      );

    }


    const p =
      data.performance;


    document
      .getElementById(
        "performanceCard"
      )
      .style
      .display =
        "block";


    setText(
      "trades",
      p.trades
    );


    setText(
      "winRate",
      `${p.winRate}%`
    );


    setText(
      "pf",
      p.profitFactor
    );


    setText(
      "netR",
      `${p.netR}R`
    );


    setText(
      "expectancy",
      `${p.expectancyR}R`
    );


    setText(
      "drawdown",
      `${p.maxDrawdownR}R`
    );


    const pfEl =
      document.getElementById(
        "pf"
      );


    const netEl =
      document.getElementById(
        "netR"
      );


    pfEl.className =
      "value " +
      (
        p.profitFactor > 1
          ?
            "green"
          :
            "red"
      );


    netEl.className =
      "value " +
      (
        p.netR > 0
          ?
            "green"
          :
        p.netR < 0
          ?
            "red"
          :
            ""
      );


    setText(
      "backtestInfo",
      `${days} days • ${mode} • ${Date.now() - started}ms`
    );


    const list =
      document.getElementById(
        "tradeList"
      );


    const visibleTrades =
      data.trades
        .slice()
        .reverse()
        .slice(
          0,
          50
        );


    list.innerHTML =
      visibleTrades.length
        ?
          visibleTrades
          .map(
            trade => {

              const sideClass =
                trade.side === "BUY"
                  ?
                    "green"
                  :
                    "red";


              const resultClass =
                trade.r > 0
                  ?
                    "green"
                  :
                trade.r < 0
                  ?
                    "red"
                  :
                    "gold";


              return `

                <div class="trade">

                  <div class="tradeTop">

                    <span class="${sideClass}">
                      ${trade.side}
                    </span>

                    <span class="${resultClass}">
                      ${trade.r}R
                    </span>

                  </div>


                  <div class="tradeMeta">

                    ${trade.setup}<br>

                    Score:
                    ${trade.score}
                    •
                    ${trade.session}
                    <br>

                    Entry:
                    ${money(trade.entry)}
                    •
                    Stop:
                    ${money(trade.stop)}
                    •
                    Target:
                    ${money(trade.target)}
                    <br>

                    MFE:
                    ${trade.mfeR}R
                    •
                    MAE:
                    ${trade.maeR}R
                    •
                    ${trade.barsHeld} min

                  </div>

                </div>

              `;

            }
          )
          .join("")
        :
          `
            <div class="small">
              No qualifying trades in this period.
            </div>
          `;


    document
      .getElementById(
        "performanceCard"
      )
      .scrollIntoView(
        {
          behavior:"smooth"
        }
      );

  }catch(
    error
  ){

    setText(
      "backtestInfo",
      "ERROR: " +
      error.message
    );

  }finally{

    button.disabled =
      false;


    button.textContent =
      "RUN BACKTEST";


    document
      .body
      .classList
      .remove(
        "loading"
      );

  }

}


loadLive();

</script>

</body>

</html>
